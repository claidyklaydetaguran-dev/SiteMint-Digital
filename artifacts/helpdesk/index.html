<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SiteMint AI Receptionist</title>
    <meta name="description" content="SiteMint AI Receptionist — a premium AI receptionist that answers calls, books appointments, and never misses a customer moment." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="SiteMint AI Receptionist" />
    <meta property="og:description" content="SiteMint AI Receptionist — a premium AI receptionist that answers calls, books appointments, and never misses a customer moment." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SiteMint AI Receptionist" />
    <meta name="twitter:description" content="SiteMint AI Receptionist — a premium AI receptionist that answers calls, books appointments, and never misses a customer moment." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Frontend V2 Phase 1: the Google Fonts stylesheet link and both
         preconnects were removed, alongside the matching @import in
         src/index.css. The dashboard now uses the system stack defined in the
         shared @workspace/design-tokens primitives — zero font requests. -->
    <script>
      (function () {
        try {
          var STORAGE_KEY = "sitemint-theme";
          var stored = localStorage.getItem(STORAGE_KEY);
          var theme = stored === "light" || stored === "dark" ? stored : "system";
          var resolved =
            theme === "system"
              ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
              : theme;
          if (resolved === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
