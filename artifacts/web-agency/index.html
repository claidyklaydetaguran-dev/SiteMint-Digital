    <!-- Release polish (2026-09-07): paint the page ground immediately so
         first paint is never a blank white frame, and preload the hero
         posters from stable public paths.
         Prerender follow-up (same day): the two font PRELOADS were removed
         and the critical faces switched from font-display:swap to
         font-display:optional. With prerendered HTML the hero text is the
         LCP element; swap produced a second, later LCP paint when the web
         font arrived (~4.0s simulated), and the preloads competed with the
         render-blocking CSS for bandwidth. With optional, the text paints
         once at first render (branded when the font makes the ~100ms block
         window — effectively always on broadband and on repeat visits —
         and a clean system-stack fallback on very slow first visits). -->
    <style>
      /* Critical faces, self-hosted (see src/index.css note). */
      @font-face { font-family: 'Space Grotesk'; font-style: normal; font-display: optional; font-weight: 700; src: url(/fonts/space-grotesk-latin-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
